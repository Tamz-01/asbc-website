  licenceScanAlt: "ແຈ້ງການກະຊວງການເງິນ ເລກທີ 2906/2026 ທີ່ມີລາຍຊື່ ASBC ລຳດັບທີ 89"
  licenceScanPlaceholder: "ຮູບສະແກນແຈ້ງການເລກທີ 2906/2026 ຈະສະແດງຢູ່ບ່ອນນີ້"
