  licenceTitle: "ໄດ້ຮັບການຮັບຮອງຈາກກະຊວງການເງິນ"
  licenceText: "ກະຊວງການເງິນ ສປປ ລາວ ໄດ້ອອກແຈ້ງການ ບັນຊີລາຍຊື່ບໍລິສັດບັນຊີ ແລະ ກວດສອບ ທີ່ໄດ້ຮັບການຮັບຮອງ ແລະ ແນະນຳໃຫ້ສາທາລະນະຊົນ ໃຊ້ບໍລິການສະເພາະບໍລິສັດທີ່ຢູ່ໃນບັນຊີນີ້ເທົ່ານັ້ນ. ASBC ຢູ່ໃນລຳດັບທີ 89 ຕາມແຈ້ງການເລກທີ 2906/2026, ລົງວັນທີ 29 ກໍລະກົດ 2026."
