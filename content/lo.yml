about:
  title: "ກ່ຽວກັບ ASBC | ບໍລິສັດທີ່ກະຊວງການເງິນຮັບຮອງ"
  description: "ASBC ເປັນບໍລິສັດບັນຊີ ແລະ ກວດສອບ ຂອງຄົນລາວ 100% ສ້າງຕັ້ງປີ 2009 ຢູ່ໃນບັນຊີລາຍຊື່ບໍລິສັດທີ່ກະຊວງການເງິນຮັບຮອງ (ລຳດັບທີ 89, ແຈ້ງການເລກທີ 2906/2026)."
  heading: "ກ່ຽວກັບ ASBC"
  storyTitle: "ປະຫວັດຂອງພວກເຮົາ"
  story:
    - "ASBC ສ້າງຕັ້ງຂຶ້ນໃນເດືອນມິຖຸນາ 2009 ໂດຍອະດີດອາຈານສອນວິຊາບັນຊີ ຢູ່ມະຫາວິທະຍາໄລແຫ່ງຊາດ ທີ່ມີປະສົບການດ້ານບັນຊີ ແລະ ທີ່ປຶກສາທຸລະກິດ ຕັ້ງແຕ່ປີ 1994. ປັດຈຸບັນ ບໍລິສັດຍັງເປັນຂອງຄົນລາວ 100% ນຳພາໂດຍຜູ້ກໍ່ຕັ້ງ, ຕັ້ງຢູ່ບ້ານໂພນປ່າເປົ້າ, ນະຄອນຫຼວງວຽງຈັນ."
    - "ພວກເຮົາໃຫ້ບໍລິການ 3 ດ້ານ: ການກວດສອບ, ບັນຊີ ແລະ ເງິນເດືອນ, ແລະ ອາກອນ. ລູກຄ້າຂອງພວກເຮົາມີທັງສະຖາບັນການເງິນຈຸລະພາກ, ສະຫະກອນສິນເຊື່ອ, ສະມາຄົມ ແລະ ບໍລິສັດໃນຂະແໜງກໍ່ສ້າງ, ການຄ້າ, ການຜະລິດ, ອະສັງຫາລິມະຊັບ ແລະ ວິສະວະກຳ."
    - "ລູກຄ້າຫຼາຍລາຍໃຊ້ບໍລິການກັບພວກເຮົາເປັນເວລາດົນນານ. ລູກຄ້າດ້ານບັນຊີ 4 ລາຍ ຢູ່ກັບພວກເຮົາເກີນ 10 ປີ."
