home:
  title: "ASBC | ບໍລິສັດບັນຊີ ແລະ ກວດສອບ ທີ່ໄດ້ຮັບການຮັບຮອງ ໃນນະຄອນຫຼວງວຽງຈັນ"
  description: "ຢູ່ໃນບັນຊີລາຍຊື່ບໍລິສັດບັນຊີ ແລະ ກວດສອບ ທີ່ກະຊວງການເງິນຮັບຮອງ. ບໍລິການກວດສອບ, ລົງບັນຊີ, ເງິນເດືອນ ແລະ ອາກອນ ສຳລັບບໍລິສັດໃນລາວ ຕັ້ງແຕ່ປີ 2009."
  heroTitle: "ບໍລິການກວດສອບ, ບັນຊີ ແລະ ອາກອນ ທີ່ທ່ານໄວ້ໃຈໄດ້"
  heroText: "ບໍລິສັດລາວ 100% ຢູ່ນະຄອນຫຼວງວຽງຈັນ ຕັ້ງແຕ່ປີ 2009. ພວກເຮົາລົງບັນຊີ, ຍື່ນອາກອນ ແລະ ກວດສອບບັນຊີໃຫ້ທ່ານ ເປັນພາສາລາວ ຫຼື ພາສາອັງກິດ."
  highlightsTitle: "ບໍລິການຂອງພວກເຮົາ"
  highlights:
    - title: "ລົງບັນຊີປະຈຳເດືອນ"
      text: "ບັນຊີທີ່ຖືກຕ້ອງ, ລາຍງານການເງິນປະຈຳເດືອນ ແລະ ເງິນເດືອນພະນັກງານ ເພື່ອໃຫ້ທ່ານຮູ້ສະຖານະທຸລະກິດຢູ່ສະເໝີ."
    - title: "ຍື່ນອາກອນ"
      text: "ຍື່ນອາກອນມູນຄ່າເພີ່ມ, ອາກອນກຳໄລ ແລະ ອາກອນລາຍໄດ້ ທັນເວລາ ພ້ອມຊ່ວຍເຫຼືອເວລາເຈົ້າໜ້າທີ່ອາກອນມາກວດ."
    - title: "ກວດສອບບັນຊີປະຈຳປີ"
      text: "ກວດສອບບົດລາຍງານການເງິນຢ່າງເປັນເອກະລາດ ພ້ອມຄຳເຫັນທີ່ລົງລາຍເຊັນ ແລະ ໜັງສືແຈ້ງຂໍ້ສັງເກດຕໍ່ຜູ້ບໍລິຫານ."
    - title: "ລາຍງານສຳລັບຜູ້ບໍລິຫານ (Board Report)"
      text: "ບັນຊີປະຈຳເດືອນ ພ້ອມບົດສະຫຼຸບສັ້ນໆ ກ່ຽວກັບກຳໄລ, ເງິນສົດ ແລະ ສິ່ງທີ່ຄວນເຝົ້າລະວັງ."
  whyTitle: "ເປັນຫຍັງຕ້ອງເລືອກ ASBC"
  why:
    - title: "ໄດ້ຮັບການຮັບຮອງຈາກກະຊວງການເງິນ"
      text: "ຢູ່ໃນບັນຊີລາຍຊື່ບໍລິສັດບັນຊີ ແລະ ກວດສອບ ທີ່ກະຊວງຮັບຮອງ: ລຳດັບທີ 89 ຕາມແຈ້ງການເລກທີ 2906/2026."
    - title: "ບໍລິສັດລາວ 100% ຕັ້ງແຕ່ປີ 2009"
      text: "ສິບເຈັດປີຢູ່ນະຄອນຫຼວງວຽງຈັນ ໂດຍຜູ້ກໍ່ຕັ້ງຍັງເປັນຜູ້ນຳພາບໍລິສັດ."
    - title: "ມີຜູ້ຈັດການຮັບຜິດຊອບວຽກຂອງທ່ານໂດຍກົງ"
      text: "ທຸກວຽກມີຜູ້ຈັດການຝ່າຍກວດສອບ, ບັນຊີ ຫຼື ອາກອນ ເປັນຜູ້ນຳ ພາຍໃຕ້ການຊີ້ນຳຂອງຜູ້ອຳນວຍການ."
    - title: "ພາສາລາວ, ອັງກິດ ແລະ ຈີນ"
      text: "ລາຍງານເປັນພາສາລາວ ຫຼື ອັງກິດ. ທີມງານທີ່ເວົ້າພາສາຈີນໄດ້ ຊ່ວຍກວດເອກະສານ ແລະ ສື່ສານກັບລູກຄ້າ."
    - title: "ຄວາມສຳພັນໄລຍະຍາວ"
      text: "ລູກຄ້າດ້ານບັນຊີ 4 ລາຍ ໄດ້ໃຊ້ບໍລິການກັບພວກເຮົາ ເກີນ 10 ປີ."
    - title: "ເປັນເອກະລາດ"
      text: "ພວກເຮົາບໍ່ກວດສອບບັນຊີຂອງບໍລິສັດ ທີ່ພວກເຮົາເປັນຜູ້ລົງບັນຊີໃຫ້."
  ctaTitle: "ປຶກສາພວກເຮົາມື້ນີ້"
  ctaText: "ບອກພວກເຮົາກ່ຽວກັບທຸລະກິດຂອງທ່ານ ແລ້ວພວກເຮົາຈະແນະນຳບໍລິການທີ່ເໝາະສົມ ພ້ອມລາຄາທີ່ຊັດເຈນ."

services:
  title: "ບໍລິການ ແລະ ລາຄາ | ASBC"
  description: "ແພັກເກດລົງບັນຊີ, ຍື່ນອາກອນ, Board Report ແລະ ກວດສອບບັນຊີປະຈຳປີ ສຳລັບບໍລິສັດໃນລາວ. ຂອບເຂດວຽກ ແລະ ລາຄາຊັດເຈນ."
  heading: "ບໍລິການ ແລະ ລາຄາ"
  intro: "ເລືອກແພັກເກດຂ້າງລຸ່ມນີ້. ທຸກວຽກເລີ່ມດ້ວຍການພົບປະສັ້ນໆ ແລະ ສັນຍາວ່າຈ້າງເປັນລາຍລັກອັກສອນ ທີ່ກຳນົດຂອບເຂດວຽກ, ກຳນົດເວລາ ແລະ ຄ່າບໍລິການ."
  includesLabel: "ສິ່ງທີ່ລວມຢູ່"
  forLabel: "ເໝາະສຳລັບ"
  priceLabel: "ລາຄາ"
  askCta: "ສອບຖາມແພັກເກດນີ້"
  packages:
    - name: "ແພັກເກດເລີ່ມຕົ້ນ (Starter)"
      for: "ບໍລິສັດໃໝ່ ໃນປີທຳອິດ"
      text: "ທຸກຢ່າງທີ່ບໍລິສັດໃໝ່ຕ້ອງການ ເພື່ອເລີ່ມຕົ້ນໃຫ້ຖືກຕ້ອງ."
      includes:
        - "ຊ່ວຍຂຶ້ນທະບຽນວິສາຫະກິດ ແລະ ທະບຽນອາກອນ"
        - "ວາງລະບົບຜັງບັນຊີ ແລະ ເອກະສານ"
        - "ລົງບັນຊີສຳລັບປີທຳອິດ"
        - "ຍື່ນອາກອນປະຈຳເດືອນ ແລະ ປະຈຳປີ"
      price: "[PRICE]"
    - name: "ລົງບັນຊີປະຈຳເດືອນ"
      for: "ວິສາຫະກິດຂະໜາດນ້ອຍ ແລະ ກາງ ແລະ ບໍລິສັດລົງທຶນຕ່າງປະເທດ ທີ່ບໍ່ມີພະແນກບັນຊີ"
      text: "ພວກເຮົາລົງບັນຊີໃຫ້ທຸກເດືອນ ເພື່ອໃຫ້ທ່ານມີເວລາບໍລິຫານທຸລະກິດ."
      includes:
        - "ລົງບັນຊີ ແລະ ຮັກສາປຶ້ມບັນຊີ"
        - "ລາຍງານການເງິນປະຈຳເດືອນ ພາຍໃນວັນທີ 15 ຂອງເດືອນຖັດໄປ"
        - "ຄິດໄລ່ເງິນເດືອນ ແລະ ຍື່ນປະກັນສັງຄົມ"
        - "ຍື່ນອາກອນມູນຄ່າເພີ່ມປະຈຳເດືອນ"
      price: "[PRICE]"
    - name: "ລາຍງານສຳລັບຜູ້ບໍລິຫານ (Board Report)"
      for: "ເຈົ້າຂອງ ແລະ ຄະນະບໍລິຫານ ທີ່ຢາກເຂົ້າໃຈຕົວເລກ"
      text: "ບັນຊີປະຈຳເດືອນ ພ້ອມລາຍງານສັ້ນ ທີ່ຂຽນສຳລັບເຈົ້າຂອງ ແລະ ຜູ້ບໍລິຫານ."
      includes:
        - "ລາຍງານການເງິນປະຈຳເດືອນ"
        - "ບົດສະຫຼຸບການເງິນ 1–2 ໜ້າ ທຸກເດືອນ"
        - "ກຳໄລ, ສະຖານະເງິນສົດ ແລະ ອັດຕາສ່ວນທີ່ສຳຄັນ"
        - "ສິ່ງທີ່ຄວນເຝົ້າລະວັງ: ຄວາມສ່ຽງ ແລະ ຂໍ້ສັງເກດສຳລັບຄະນະບໍລິຫານ"
      price: "[PRICE]"
      featured: true
    - name: "ປິດບັນຊີທ້າຍປີ"
      for: "ບໍລິສັດທີ່ລົງບັນຊີເອງ ແຕ່ຕ້ອງການຄວາມຊ່ວຍເຫຼືອໃນທ້າຍປີ"
      text: "ພວກເຮົາປິດບັນຊີ ແລະ ສ້າງບົດລາຍງານການເງິນທ້າຍປີ ໃຫ້ພ້ອມສຳລັບການກວດສອບ ແລະ ການຍື່ນອາກອນ."
      includes:
        - "ທົບທວນ ແລະ ປັບປຸງບັນຊີ"
        - "ບັນທຶກລາຍການປິດບັນຊີທ້າຍປີ"
        - "ບົດລາຍງານການເງິນທ້າຍປີ"
      price: "[PRICE]"
    - name: "ກວດສອບບັນຊີປະຈຳປີ"
      for: "ບໍລິສັດ, ສະຖາບັນການເງິນຈຸລະພາກ ແລະ ສະມາຄົມ ທີ່ຕ້ອງໄດ້ກວດສອບຕາມກົດໝາຍ"
      text: "ການກວດສອບບົດລາຍງານການເງິນຢ່າງເປັນເອກະລາດ ໂດຍບໍລິສັດທີ່ກະຊວງການເງິນຮັບຮອງ."
      includes:
        - "ກວດສອບບົດລາຍງານການເງິນ ພ້ອມຄຳເຫັນຂອງຜູ້ກວດສອບທີ່ລົງລາຍເຊັນ"
        - "ໜັງສືແຈ້ງຂໍ້ສັງເກດຕໍ່ຜູ້ບໍລິຫານ ກ່ຽວກັບລະບົບຄວບຄຸມ"
