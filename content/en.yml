home:
  title: "ASBC | Approved accounting and audit firm in Vientiane"
  description: "On the Ministry of Finance's list of approved accounting and audit firms. Audit, bookkeeping, payroll and tax services for companies in Laos since 2009."
  heroTitle: "Audit, accounting and tax you can rely on"
  heroText: "A 100% Lao-owned firm in Vientiane since 2009. We keep your books, file your taxes and audit your accounts, in Lao or English."
  highlightsTitle: "What we do"
  highlights:
    - title: "Monthly bookkeeping"
      text: "Accurate books, monthly management accounts and payroll, so you always know where you stand."
    - title: "Tax filing"
      text: "VAT, profit tax and personal income tax returns filed on time, plus support during tax audits."
    - title: "Annual audit"
      text: "Independent financial statement audits with a signed opinion and management letter."
    - title: "Board Report"
      text: "Your monthly accounts plus a short summary of profit, cash and what to watch."
  whyTitle: "Why choose ASBC"
  why:
    - title: "Approved by the Ministry of Finance"
      text: "On the Ministry's list of approved accounting and audit firms: No. 89, notice 2906/2026."
    - title: "100% Lao-owned since 2009"
      text: "Seventeen years in Vientiane, with the founder still leading the firm."
    - title: "A named manager for your work"
      text: "Each engagement is led by our Audit, Accounting or Tax Manager, with oversight from the Managing Director."
    - title: "Lao, English and Chinese"
      text: "Reports in Lao or English. Chinese speakers in the team help with documents and communication."
    - title: "Relationships that last"
      text: "Four accounting clients have stayed with us for more than ten years."
    - title: "Independent"
      text: "We never audit a company whose books we keep."
  ctaTitle: "Talk to us today"
  ctaText: "Tell us about your business and we will reply with the right service and a clear price."

services:
  title: "Services and prices | ASBC"
  description: "Bookkeeping, tax filing, Board Report and annual audit packages for companies in Laos. Clear scope and prices."
  heading: "Services and prices"
  intro: "Choose a package below. Every engagement starts with a short meeting and a written engagement letter that sets out the scope, timetable and fee."
  includesLabel: "What's included"
  forLabel: "Best for"
  priceLabel: "Price"
  askCta: "Ask about this package"
  packages:
    - name: "Starter"
      for: "New companies in their first year"
      text: "Everything a new company needs to start on the right foot."
      includes:
        - "Help with enterprise and tax registration"
        - "Setting up your chart of accounts and records"
        - "Bookkeeping for the first year"
        - "Monthly and annual tax filing"
      price: "[PRICE]"
    - name: "Monthly bookkeeping"
      for: "SMEs and foreign-invested companies without a finance team"
      text: "We keep your books every month so you can focus on running the business."
      includes:
        - "Bookkeeping and ledger maintenance"
        - "Monthly management accounts by the 15th of the following month"
        - "Payroll and social security filings"
        - "Monthly VAT filing"
      price: "[PRICE]"
    - name: "Board Report"
      for: "Owners and boards who want the numbers explained"
      text: "Your monthly accounts plus a short report written for owners and directors."
      includes:
        - "Monthly management accounts"
        - "A 1–2 page financial summary each month"
        - "Profit, cash position and key ratios"
        - "What to watch: risks and points for the board"
      price: "[PRICE]"
      featured: true
    - name: "Year-end closing"
      for: "Companies that keep their own books but need help at year end"
      text: "We close your books and prepare year-end financial statements, ready for audit and tax filing."
      includes:
        - "Review and adjustment of your accounts"
        - "Year-end closing entries"
        - "Year-end financial statements"
      price: "[PRICE]"
    - name: "Annual audit"
      for: "Companies, microfinance institutions and associations that need a statutory audit"
      text: "An independent audit of your financial statements by a Ministry of Finance approved firm."
      includes:
        - "Financial statement audit with a signed audit opinion"
        - "Management letter with control findings"
        - "Agreed-upon procedures if needed"
      price: "[PRICE]"
      note: "Independence: we do not audit a company whose books we keep or whose year-end accounts we prepare."
  oneOffTitle: "One-off services"
  oneOffIntro: "Need help with a single task? We also offer:"
  oneOff:
    - name: "Tax certificate renewal"
      price: "[PRICE]"
    - name: "Accounting licence renewal"
      price: "[PRICE]"
    - name: "E-invoice setup and renewal"
      price: "[PRICE]"
  howTitle: "How we work"
  how:
    - title: "Meet"
      text: "A short meeting to understand your business and needs."
    - title: "Agree"
      text: "An engagement letter with scope, timetable, fee and your manager."
    - title: "Hand over"
      text: "You share your records; we check opening balances."
    - title: "Deliver"
      text: "We deliver reports and returns on the agreed timetable and review them with you."

about:
  title: "About ASBC | Ministry of Finance approved firm"
  description: "ASBC is a 100% Lao-owned accounting and audit firm founded in 2009, on the Ministry of Finance's list of approved firms (No. 89, notice 2906/2026)."
  heading: "About ASBC"
  storyTitle: "Our story"
  story:
    - "ASBC was founded in June 2009 by a former accounting lecturer at the National University of Laos, with experience in accounting and business consulting going back to 1994. Today it is still a 100% Lao-owned firm, led by its founder, in Ban Phonpapao, Vientiane."
    - "We provide three services: audit and assurance, accounting and payroll, and tax. Our clients include microfinance institutions, credit unions, associations, and companies in construction, trading, manufacturing, real estate and engineering."
    - "Many clients stay with us for years. Four accounting relationships have lasted more than ten years."
