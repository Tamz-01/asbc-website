about:
  title: "关于 ASBC | 财政部认可的公司"
  description: "ASBC 是一家成立于2009年、100%老挝本地所有的会计及审计公司，列入老挝财政部认可名单（第 2906/2026 号通知第 89 号）。"
  heading: "关于 ASBC"
  storyTitle: "我们的故事"
  story:
    - "ASBC 于2009年6月由一位曾任老挝国立大学会计讲师的创始人创立，创始人自1994年起从事会计及商业咨询工作。至今公司仍为100%老挝本地所有，由创始人领导，位于万象 Phonpapao 村。"
    - "我们提供三类服务：审计与鉴证、会计与工资、以及税务。我们的客户包括小额信贷机构、信用社、协会，以及建筑、贸易、制造、房地产和工程领域的公司。"
    - "许多客户与我们长期合作。有四家会计客户合作超过十年。"
